name: RankBook HRMS Test Automation Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suiteXml:
        description: "TestNG Suite XML to execute"
        required: true
        default: "src/test/resources/testng-web.xml"
        type: choice
        options:
          - "src/test/resources/testng-web.xml"
          - "src/test/resources/testng-api.xml"
          - "src/test/resources/testng-all.xml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  automation-tests:
    name: Regression Execution & Reporting
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Setup Google Chrome (Headless Runner)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Environment & Binaries
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run TestNG Automation Suite
        id: run-tests
        continue-on-error: true
        run: |
          SUITE_FILE="${{ github.event.inputs.suiteXml || 'src/test/resources/testng-web.xml' }}"
          echo "Executing suite: $SUITE_FILE"

          mvn clean test \
            -DsuiteXmlFile="$SUITE_FILE" \
            -Dheadless=true \
            -Dallure.results.directory="target/allure-results"

      - name: Copy Root Allure Results (If Produced)
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            mkdir -p target/allure-results
            cp -r allure-results/* target/allure-results/
          fi

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Archive Allure Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-execution-${{ github.run_number }}
          path: target/allure-report/
          retention-days: 14

      - name: Archive Raw Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-allure-results-${{ github.run_number }}
          path: target/allure-results/
          retention-days: 7

      - name: Verify Test Step Status
        if: steps.run-tests.outcome != 'success'
        run: |
          echo "Test suite failed during execution. Failing build step."
          exit 1
